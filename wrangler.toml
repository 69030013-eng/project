name = "siet-canteen-app"
pages_build_output_dir = "."
compatibility_date = "2024-09-23"

# ====================================================================
# Cloudflare D1 Database Binding
# ====================================================================
# To link your Cloudflare D1 database:
# 1. Create database in Cloudflare: wrangler d1 create siet-canteen-db
#    (or create via Cloudflare Dashboard > Workers & Pages > D1 SQL Database)
# 2. Paste your database_id below:
# ====================================================================

[[d1_databases]]
binding = "DB"
database_name = "siet-canteen-db"
database_id = "YOUR_CLOUDFLARE_D1_DATABASE_ID"
